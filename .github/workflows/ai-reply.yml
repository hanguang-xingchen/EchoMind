name: AI 倾听者回复

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  ai-reply:
    if: github.event.label.name == '倾诉'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 锁定 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECHOMIND_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue lock "$ECHOMIND_ISSUE_NUMBER" --reason resolved

      - name: 落地 Issue 正文
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue_body.md"

      - name: 装配历史上下文
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECHOMIND_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ECHOMIND_BODY_FILE: ${{ runner.temp }}/issue_body.md
        run: bash .github/autoreply.sh context

      - name: 生成倾听回复
        id: generate
        continue-on-error: true
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ECHOMIND_ISSUE_TITLE: ${{ github.event.issue.title }}
          ECHOMIND_BODY_FILE: ${{ runner.temp }}/issue_body.md
        run: bash .github/autoreply.sh generate

      - name: 评论回复
        if: steps.generate.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECHOMIND_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ECHOMIND_ISSUE_NUMBER" --body-file "$RUNNER_TEMP/reply.md"

      - name: 兜底评论
        if: steps.generate.outputs.success != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECHOMIND_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ECHOMIND_ISSUE_NUMBER" --body "抱歉，倾听者暂时无法回复。如果你现在需要帮助，可以拨打心理援助热线：400-161-9995。你的感受很重要，请照顾好自己。"
