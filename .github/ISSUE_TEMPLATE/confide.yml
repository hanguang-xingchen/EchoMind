name: 我要倾诉
description: 写下此刻的心事，AI 倾听者会温柔地回复你
labels: ["倾诉"]
body:
  - type: markdown
    attributes:
      value: |
        ## 开始前，三句说明

        **一、请先给这个仓库点一个 ⭐ Star。** 回声心语是一个人自掏 token 维护的公益项目，每一条回复都是真金白银的模型调用，Star 是这里唯一不花钱的“供电方式”。

        **二、这里不是私聊。** Issue 是公开内容，全世界都能看到；锁定只是关闭跟帖，不是隐藏。如果不想把心事和你的主账号连在一起，建议开一个小号来写。

        **三、倾听者只陪伴，不建议。** 不评判对错，不催你好起来，也不给你布置任务。

  - type: textarea
    id: confide
    attributes:
      label: 你想说点什么
      description: 想到什么就写什么，不用组织语言，不用讲道理，长短都算数。
      placeholder: |
        可以从很短的一句开始，比如：
        今天真的好累。
        我和朋友闹别扭了，其实也不是什么大事。
        我说不清自己在难过什么，就是心里很堵。
        我最近一直在想，我到底想干什么。
      value: |
        今天压在我心里的是：
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        提交后 `倾诉` 标签会自动加上，你不用去右侧栏手动点任何东西。

        想在新的倾诉里提到以前写过的内容，可以在正文中用 `[引用:#数字]`（例如 `[引用:#5]`），倾听者会把它一起看。
